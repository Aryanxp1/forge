# FORGE — zero-dependency local data engine.
#
# Build system
# ------------
# `setuptools` is a BUILD-TIME tool only (declared below). It is NOT a
# runtime dependency. After `pip install .`, the installed `forge` package
# imports nothing outside the Python standard library.
#
# PEP 621 project metadata; setuptools build backend.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
description = "Zero-dependency local data engine: durable storage, WAL crash recovery, and derived-index search."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Aryanxp1"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Search",
]

[project.scripts]
forge = "forge.cli:main"

[project.urls]
Homepage = "https://github.com/Aryanxp1/forge"

[tool.setuptools.packages.find]
where = ["src"]
